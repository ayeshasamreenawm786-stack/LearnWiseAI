<!DOCTYPE html>
<html>

<head>
    <title>Quiz - LearnWise AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>LearnWise AI</h1>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </header>

    <main>

        <h2>Quiz</h2>

        {% if questions %}

            <form method="POST" action="/submit-quiz">

                    <input type="hidden" name="quiz_id" value="{{ quiz_id }}">
                {% for question in questions %}

                    <div class="quiz-question">

                        <h3>
                            {{ loop.index }}. {{ question.question }}
                        </h3>

                        <p>Topic: {{ question.topic }}</p>

                        <label>
                            <input type="radio"
                                   name="q{{ loop.index }}"
                                   value="A"
                                   required>
                            {{ question.options.A }}
                        </label>

                        <br>

                        <label>
                            <input type="radio"
                                   name="q{{ loop.index }}"
                                   value="B">
                            {{ question.options.B }}
                        </label>

                        <br>

                        <label>
                            <input type="radio"
                                   name="q{{ loop.index }}"
                                   value="C">
                            {{ question.options.C }}
                        </label>

                        <br>

                        <label>
                            <input type="radio"
                                   name="q{{ loop.index }}"
                                   value="D">
                            {{ question.options.D }}
                        </label>

                    </div>

                    <hr>

                {% endfor %}

                <button type="submit">Submit Quiz</button>

            </form>

        {% else %}

            <p>Select the number of questions and generate your quiz.</p>

            <form method="POST">

                <label for="question_count">
                    Number of Questions:
                </label>

                <select name="question_count" id="question_count">

                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>

                </select>

                <br><br>

                <button type="submit">Generate Quiz</button>

            </form>

        {% endif %}

    </main>

</body>

</html>
